# Nixpacks Configuration for Swasth ID Backend

# 1. Setup Phase: Install System Packages
# We need python, tesseract (for OCR), and libraries for OpenCV (libxcb, libgl, etc.)
[phases.setup]
nixPkgs = [
    "python311",         # Pin Python 3.11 for stability (avoid 3.13 issues)
    "tesseract",         # Required for pytesseract OCR
    "libxcb",            # Required for OpenCV
    "libglib",           # Common dependency
    "glibc",
    "libxrender",
    "libxext"
]

# 2. Install Phase: Install Python Dependencies
[phases.install]
cmds = [
    "python -m venv .venv",
    ".venv/bin/pip install -U pip",
    ".venv/bin/pip install -r requirements.txt"
]

# 3. Start Phase
[start]
cmd = ".venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
