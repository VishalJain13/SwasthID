# Nixpacks Configuration for Swasth ID Backend

# 1. Setup Phase: Install System Packages
# Using explicit package names from nixpkgs to ensure libraries are found
[phases.setup]
nixPkgs = [
    "python311",         # Python 3.11
    "tesseract",         # OCR
    "ffmpeg",            # Video processing support often needed by cv2
    "glib",              # Core library
    "xorg.libxcb",       # Fixes libxcb.so.1 error
    "xorg.libX11",
    "xorg.libXext",
    "xorg.libXrender",
    "libGL"              # OpenGL support
]

# 2. Install Phase: Install Python Dependencies
[phases.install]
cmds = [
    "python -m venv .venv",
    ".venv/bin/pip install -U pip",
    ".venv/bin/pip install -r requirements.txt"
]

# 3. Start Phase
[start]
cmd = ".venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
